<!doctype html><html data-mode="dark"><head><meta charset="utf-8"><title>yeni dom</title>
<style>
.cds-root{--cds-surface-1:#191919;--cds-surface-3:#303030;--cds-text-primary:#fff;--cds-text-secondary:#ffffffbf;--cds-border:#ffffff0a}
.bg-surface-1{background:var(--cds-surface-1)} .bg-surface-3{background:var(--cds-surface-3)}
.text-primary{color:var(--cds-text-primary)} .text-secondary{color:var(--cds-text-secondary)}
.dframe-sidebar{background:#1f1f1f}
</style></head>
<body class="bg-surface-1 text-primary"><div id="root" class="cds-root dframe-root">
<aside class="dframe-sidebar"><div data-testid="sidebar"><div class="group hit-row"><a class="w-full text-secondary" aria-current="page" href="#">Açık sohbet</a></div><div class="group hit-row"><a class="w-full text-secondary" href="#">Başka sohbet</a></div></div></aside>
<main class="dframe-content"><div data-testid="chat-header" class="dframe-header"><h2>Başlık</h2></div>
<div class="rounded-lg" aria-label="Mesaj 1/2"><div data-testid="user-message"><div class="cds-user-message-body"><p class="text-primary">benim mesajım</p></div></div></div>
<div class="rounded-lg" aria-label="Mesaj 2/2"><div data-testid="assistant-message"><div class="prose"><div class="standard-markdown"><p class="text-primary" id="yp">yanıt <code id="sk">kod</code></p>
<div class="relative group/copy bg-bg-000/50 border-0.5 border-border-400 rounded-[var(--msg-block-radius,0.5rem)]" id="kk"><pre class="code-block__code"><code>x = 1</code></pre></div></div></div></div></div>
<fieldset><div class="bg-surface-3 relative flex" id="yk"><span class="pointer-events-none select-none absolute" id="yt">Yanıtla</span><div class="tiptap ProseMirror" contenteditable="true"></div></div></fieldset>
</main></div></body></html>
